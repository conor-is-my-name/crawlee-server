services:
  scraper1:
    tmpfs:
      - /tmp:size=1G,mode=1777
      - /usr/src/app/storage:size=500M,mode=1777
      - /var/cache:size=100M,mode=1777
      - /root/.cache:size=500M,mode=1777
      - /home/pptruser/.cache:size=500M,mode=1777
    build: .
    env_file: .env
    environment:
      PORT: 11000
      CRAWLEE_STORAGE_DIR: /usr/src/app/storage
      TMPDIR: /tmp
    ports:
      - "11000:11000"
    cpu_shares: 512
    cpuset: "0"
    read_only: true
    security_opt:
      - no-new-privileges
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 3G
    networks:
      - shark

